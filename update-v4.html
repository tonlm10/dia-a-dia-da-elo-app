<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizando Dia a Dia da Elo</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff6fb;color:#2b2340;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}.box{max-width:420px;background:white;border-radius:24px;padding:28px;box-shadow:0 12px 40px #e9c7dd80}h1{color:#e83f91}.spin{font-size:48px;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(1.15)}}small{color:#6f667a}
</style>
</head>
<body><div class="box"><div class="spin">⭐</div><h1>Atualizando o app...</h1><p id="msg">Removendo apenas o cache antigo. Seus pontos e progresso serão mantidos.</p><small>Dia a Dia da Elo • V4</small></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.map(r=>r.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.map(k=>caches.delete(k)));
  }
  document.getElementById('msg').textContent='Pronto! Abrindo a V4...';
  setTimeout(()=>location.replace('./?v=4-'+Date.now()),700);
 }catch(e){
  document.getElementById('msg').textContent='Atualização concluída. Toque para voltar ao app.';
  setTimeout(()=>location.replace('./?v=4-'+Date.now()),1200);
 }
})();
</script></body></html>
