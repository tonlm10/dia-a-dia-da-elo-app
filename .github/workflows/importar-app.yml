name: Importar ZIP do app

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-upload.zip'

permissions:
  contents: write

concurrency:
  group: importar-app
  cancel-in-progress: true

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar ZIP
        run: |
          test -f app-upload.zip || { echo 'ERRO: app-upload.zip não encontrado na raiz.'; exit 1; }
          unzip -t app-upload.zip >/dev/null

      - name: Extrair e organizar aplicativo
        run: |
          set -e
          rm -rf /tmp/elo-app
          mkdir -p /tmp/elo-app
          unzip -q -o app-upload.zip -d /tmp/elo-app

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'app-upload.zip' \
            -exec rm -rf {} +

          rm -rf /tmp/elo-app/.github
          cp -a /tmp/elo-app/. .
          rm -f app-upload.zip

          test -f index.html || { echo 'ERRO: index.html não encontrado após a extração.'; exit 1; }

      - name: Salvar nova versão
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para salvar.'
            exit 0
          fi

          git commit -m 'Atualizar app pelo ZIP'
          git push origin HEAD:"${GITHUB_REF_NAME}"
